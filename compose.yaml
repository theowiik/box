# The part of the box that stays on: box-essentials, the weather and feeds
# posting to the box over Wi-Fi. On the server:
#
#   docker compose up -d --build
#
# then set it up at http://<the server>:8090. The .env (see .env.example) is
# optional.
name: box
services:
  box-essentials:
    build: connectors/box-essentials
    restart: unless-stopped
    # The host's network: box.local is found over mDNS, link-local multicast
    # that Docker's own bridge network does not carry. The settings page is
    # on the host's port 8090 (BOX_WEB_ADDR to move it).
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      BOX_STATE_DIR: /state
    volumes:
      # The settings and feed history. (Named from when this was only the
      # sources; kept so an existing install keeps its history.)
      - sources-state:/state

volumes:
  sources-state:
