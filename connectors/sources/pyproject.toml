[project]
name = "box-sources"
version = "0.1.0"
description = "Weather, feeds and visuals for the box: they run here and POST to it"
requires-python = ">=3.11"
# Standard library only, so it runs on any machine with Python.
dependencies = []

[project.scripts]
box-sources = "box_sources.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box_sources"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
