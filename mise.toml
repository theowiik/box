# The whole repo from the top: `mise tasks` lists everything, `mise run <task>`
# runs it. core/ decides what the screen shows; displays/ show it (on an
# ESP-Mosaico, in a browser); connectors/box-essentials sends it things and runs in Docker on a
# server that stays on (compose.yaml).
#
# mise only launches tasks: every tool (ESP-IDF, CMake, Go) lives in the dev
# container that toolchain/run starts, so Docker is all a machine needs. The
# first task (or `mise run setup`) fetches the pinned ESP-Mosaico workspace into
# .deps/ and builds that image (once, a few GB).
# Extra arguments go to the command, e.g. `mise run send -- --title Hi hello`.

[vars]
in = "{{config_root}}/toolchain/run"

# --- displays: the ESP-Mosaico (install, logs, screenshot need USB), a browser

[tasks.firmware]
description = "Build the ESP-Mosaico firmware"
run = "{{vars.in}} idf.py -C displays/mosaico -D IDF_TARGET=esp32s31 app"

[tasks.install]
description = "Build and install the firmware on the board over USB"
run = "{{vars.in}} mosaico iris system-update --project {{config_root}}/displays/mosaico"

[tasks.logs]
description = "Follow the board's log"
run = "{{vars.in}} mosaico iris logs --project {{config_root}}/displays/mosaico"

[tasks.screenshot]
description = "Save what the screen shows to box.png"
run = "{{vars.in}} mosaico iris screenshot {{config_root}}/box.png --project {{config_root}}/displays/mosaico"

[tasks.setup]
description = "Fetch the Mosaico workspace into .deps/ and build the dev container (pins: toolchain/versions)"
run = "{{vars.in}} sh -c 'idf.py --version && go version && echo workspace: $MOSAICO_WORKSPACE'"

[tasks.shell]
description = "A shell in the dev container, with ESP-IDF and Go loaded"
run = "{{vars.in}} bash"

[tasks.web]
description = "The box in a browser, on :8080: the core and its API without hardware (mise run web -- --style led)"
run = """{{vars.in}} sh -c 'cmake -S displays/web -B displays/web/build -G Ninja >/dev/null && cmake --build displays/web/build >/dev/null && exec displays/web/build/box-web "$@"' box-web"""

# --- box-essentials: one-offs from any machine on the box's network --------------

[tasks.status]
description = "What is on screen"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . status"

[tasks.send]
description = "Show some text: mise run send -- [--title T] TEXT"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . send"

[tasks.demo]
description = "Play a built-in visual: mise run demo -- beer (rainbow, life, gradient, beer)"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . visual"

[tasks.gif]
description = "Play a GIF: mise run gif -- party.gif"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . gif"

[tasks.display]
description = "What the box can do; change settings: mise run display -- --style led"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . display"

[tasks.essentials]
description = "Run box-essentials here, in the foreground, with its page on :8090"
dir = "connectors/box-essentials"
run = "{{vars.in}} go run . run"

# --- the server: box-essentials in Docker ---------------------------------------

[tasks.server]
description = "Start box-essentials in Docker (on the server)"
run = "docker compose up -d --build"

[tasks.server-logs]
description = "Follow box-essentials' log"
run = "docker compose logs -f box-essentials"

[tasks.server-down]
description = "Stop box-essentials"
run = "docker compose down"

# --- checks -------------------------------------------------------------------

[tasks.test-core]
description = "The core, built and tested on the host side (ASan/UBSan)"
run = "{{vars.in}} sh -c 'cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Debug >/dev/null && cmake --build core/build && ./core/build/box_core_tests'"

[tasks.test-essentials]
description = "box-essentials: gofmt, vet, tests (with the race detector)"
dir = "connectors/box-essentials"
run = """{{vars.in}} sh -c 'test -z "$(gofmt -l .)" || { gofmt -l .; echo "run: mise run format"; exit 1; }; go vet ./... && CGO_ENABLED=1 go test -race ./...'"""

[tasks.check]
description = "Everything: the core's tests and box-essentials' checks"
depends = ["test-core", "test-essentials"]

[tasks.format]
description = "Format box-essentials"
dir = "connectors/box-essentials"
run = "{{vars.in}} gofmt -w ."
